<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who's watching? - Netflix</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@400;500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #141414;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Netflix Logo */
        .logo-container {
            position: absolute;
            top: 20px;
            left: 40px;
        }

        .logo {
            fill: #e50914;
            height: 45px;
        }

        h1 {
            font-size: 3.5vw;
            font-weight: 500;
            margin-bottom: 2em;
        }

        .profiles-container {
            display: flex;
            gap: 2vw;
            justify-content: center;
        }

        .profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: grey;
            transition: color 0.2s ease-in-out;
            width: max(10vw, 84px);
            max-width: 200px;
        }

        .profile:hover {
            color: white;
        }

        .avatar {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 4px;
            background-size: cover;
            background-position: center;
            border: 3px solid transparent;
            box-sizing: border-box;
            transition: border-color 0.2s ease-in-out;
            position: relative;
        }

        .profile:hover .avatar {
            border-color: white;
        }

        .name {
            margin-top: 0.6em;
            font-size: 1.3vw;
            text-align: center;
        }

        /* Manage Profiles Button */
        .manage-btn {
            margin-top: 4em;
            padding: 0.5em 1.5em;
            background: transparent;
            color: grey;
            border: 1px solid grey;
            font-size: 1.2vw;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .manage-btn:hover {
            color: white;
            border-color: white;
        }

        @media (max-width: 800px) {
            h1 { font-size: 30px; }
            .name { font-size: 14px; }
            .manage-btn { font-size: 14px; }
            .profiles-container { gap: 15px; }
        }
    </style>
</head>
