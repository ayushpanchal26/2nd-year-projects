<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing - Life of Jia & Aryan</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; /* Pure black for cinematic effect */
            color: #fff;
            font-family: 'Montserrat', Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-btn {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #fff;
            text-decoration: none;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            opacity: 0;
            animation: fadeInBtn 1s ease 1s forwards;
            transition: color 0.3s ease;
            z-index: 100;
        }

        .back-btn:hover {
            color: #b3b3b3;
        }

        .back-btn svg {
            margin-right: 8px;
            width: 24px;
            height: 24px;
        }

        @keyframes fadeInBtn {
            0% { opacity: 0; }
            100% { opacity: 0.7; }
        }

        .credits-container {
            text-align: center;
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .credit-text {
            position: absolute;
            font-size: 2.5rem;
            font-weight: 500;
            letter-spacing: 4px;
            opacity: 0;
            text-transform: uppercase;
        }

        /* Sequential Animation Setup */

        .credit-1 {
            animation: fadeSequence 4s ease-in-out 1s forwards;
            color: #E50914; /* Netflix Red */
            font-weight: 700;
            letter-spacing: 6px;
        }

        .credit-2 {
            animation: fadeSequence 4s ease-in-out 5s forwards;
        }

        .credit-3 {
            animation: fadeSequence 4s ease-in-out 9s forwards;
        }

        .credit-4 {
            animation: fadeSequence 5s ease-in-out 13s forwards;
        }

        @keyframes fadeSequence {
            0% { opacity: 0; transform: scale(0.95); }
            20% { opacity: 1; transform: scale(1); }
            80% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0; transform: scale(1.1); }
        }

        .small-text {
            display: block;
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

    </style>
</head>
<body>

    <a href="home.html" class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Back to Home
    </a>

    <div class="credits-container">
        <div class="credit-text credit-1">A Netflix Original Series</div>

        <div class="credit-text credit-2">
            <span class="small-text">Directed by</span>
            GOD
        </div>

        <div class="credit-text credit-3">
            <span class="small-text">Produced by</span>
            JIA & ARYAN
        </div>

        <div class="credit-text credit-4">
            <span class="small-text">Starring</span>
            JIA & ARYAN
        </div>
    </div>

    <script>
        // Optional: Redirect back to home after the sequence is fully complete
        setTimeout(function() {
            window.location.href = "home.html";
        }, 19000); // Redirects 1s after the final animation finishes (13s delay + 5s duration + 1s padding)
    </script>
</body>
</html>
